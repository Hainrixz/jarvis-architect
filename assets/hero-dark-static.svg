<title id="t">Jarvis Architect</title><desc id="d">Anillo HUD tipo reactor junto al título JARVIS ARCHITECT, el lema "Dile a qué te dedicas. El arquitecto decide el resto." y chips de runtimes: Claude Code, Hermes, OpenClaw, Codex, Ollama, Railway.</desc>
